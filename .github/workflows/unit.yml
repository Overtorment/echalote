name: unit

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Skip prepare (full rollup build); tests import from src via Bun.
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Fix hazae41/x509 package exports
        run: bun scripts/fix-hazae41-x509.mjs

      - name: Run unit tests
        run: bun run test:unit
