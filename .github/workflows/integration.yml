name: integration

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  live:
    name: Tor exit HTTP
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Fix hazae41/x509 package exports
        run: bun scripts/fix-hazae41-x509.mjs

      - name: Run live integration test
        run: bun test tests/integration
